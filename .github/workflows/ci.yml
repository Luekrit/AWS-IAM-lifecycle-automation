name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token: the workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Tip: pin each action to a full commit SHA (e.g. with `pinact` or Dependabot) for supply-chain safety.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (incl. bandit security rules)
        run: ruff check .

      - name: Validate lifecycle CSVs
        run: |
          python Phase2_Joiner_automation/validate_csv.py
          python Phase2_Joiner_automation/validate_csv.py Phase3_mover_leaver_automation/mover_leaver.csv --schema lifecycle

      - name: Unit tests against mocked AWS (no real account needed)
        run: pytest -q
