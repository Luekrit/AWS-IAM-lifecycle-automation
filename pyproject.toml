[project]
name = "aws-iam-lifecycle-automation"
version = "2.0.0"
description = "Joiner/Mover/Leaver automation and access review for AWS IAM"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[iam,sts,secretsmanager]>=5.0", "ruff>=0.6"]

[tool.setuptools]
packages = ["iam_lifecycle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 132
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "S105", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
